<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Lantern lane at dusk — a winding path with lanterns and the studio door glowing in the distance">
  <defs>
    <linearGradient id="g6sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a6b"/>
      <stop offset="0.55" stop-color="#7a5a6e"/>
      <stop offset="1" stop-color="#d98a5a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g6sky)"/>
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="2.2"/><circle cx="200" cy="40" r="1.8"/><circle cx="330" cy="80" r="2"/>
    <circle cx="470" cy="50" r="2.4"/><circle cx="600" cy="90" r="1.8"/><circle cx="720" cy="45" r="2.2"/>
    <circle cx="540" cy="140" r="1.6"/><circle cx="150" cy="150" r="1.6"/>
  </g>
  <circle cx="640" cy="330" r="46" fill="#f7d774" opacity="0.9"/>
  <circle cx="640" cy="330" r="70" fill="#f7d774" opacity="0.25"/>

  <path d="M0 400 C220 370 480 405 800 385 L800 600 L0 600 Z" fill="#4a5a3f"/>
  <path d="M0 480 C260 455 540 490 800 470 L800 600 L0 600 Z" fill="#3c4c33"/>

  <!-- distant round door with warm window -->
  <g transform="translate(600 430)">
    <circle r="40" fill="#5a3a22"/>
    <circle r="32" fill="#2f5429"/>
    <circle cx="-9" cy="-12" r="8" fill="#ffd98a"/>
    <circle cx="13" cy="6" r="4.5" fill="#e8b64c"/>
    <circle r="46" fill="#ffd98a" opacity="0.18"/>
  </g>

  <!-- winding path -->
  <path d="M120 600 C180 540 300 520 380 500 C470 477 540 480 592 462 L616 470 C560 492 490 494 402 516 C310 540 220 562 190 600 Z" fill="#c9b489" opacity="0.9"/>

  <!-- lantern posts -->
  <g>
    <rect x="236" y="470" width="9" height="52" rx="3" fill="#2c2620"/>
    <circle cx="240" cy="462" r="20" fill="#f7d774" opacity="0.35"/>
    <rect x="231" y="452" width="17" height="20" rx="6" fill="#e8b64c" stroke="#2c2620" stroke-width="3"/>
  </g>
  <g>
    <rect x="392" y="440" width="9" height="50" rx="3" fill="#2c2620"/>
    <circle cx="396" cy="432" r="19" fill="#f7d774" opacity="0.35"/>
    <rect x="388" y="422" width="16" height="19" rx="6" fill="#e8b64c" stroke="#2c2620" stroke-width="3"/>
  </g>
  <g>
    <rect x="516" y="462" width="8" height="44" rx="3" fill="#2c2620"/>
    <circle cx="520" cy="455" r="16" fill="#f7d774" opacity="0.35"/>
    <rect x="513" y="446" width="14" height="17" rx="5" fill="#e8b64c" stroke="#2c2620" stroke-width="3"/>
  </g>

  <!-- fireflies -->
  <g fill="#ffe9a8">
    <circle cx="150" cy="430" r="3"/><circle cx="320" cy="400" r="2.5"/><circle cx="450" cy="380" r="3"/>
    <circle cx="690" cy="420" r="2.5"/><circle cx="260" cy="520" r="2.5"/><circle cx="560" cy="540" r="3"/>
  </g>
</svg>
